# ─── domio.top — Nginx reverse proxy config ───────────────────────────────────
#
# Structure:
#   domio.top          → landing page  (port 3030)
#   *.domio.top        → domio-shops   (port 3031)
#
# Requires:
#   - wildcard SSL cert: /etc/letsencrypt/live/domio.top/
#   - certbot DNS challenge (see setup instructions below)

# ── Upstream apps ──────────────────────────────────────────────────────────────
upstream landing {
    server 127.0.0.1:3030;
    keepalive 32;
}

upstream shops {
    server 127.0.0.1:3031;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name domio.top *.domio.top;
    return 301 https://$host$request_uri;
}

# ── Landing: domio.top ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domio.top www.domio.top;

    ssl_certificate     /etc/letsencrypt/live/domio.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domio.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "strict-origin" always;

    # Static assets — long cache
    location /_next/static/ {
        proxy_pass http://landing;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://landing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Shops: *.domio.top ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.domio.top;

    ssl_certificate     /etc/letsencrypt/live/domio.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domio.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    location /_next/static/ {
        proxy_pass http://shops;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://shops;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass original host so Next.js middleware can read subdomain
        proxy_set_header X-Original-Host   $host;
        proxy_read_timeout 60s;
    }
}
