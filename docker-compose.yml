services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: domio:latest
    container_name: domio_web
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
