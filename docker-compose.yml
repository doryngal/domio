services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: domio:latest
    container_name: domio_web
    restart: unless-stopped
    expose:
      - "3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.domio.rule=Host(`domio.top`)"
      - "traefik.http.routers.domio.entrypoints=websecure"
      - "traefik.http.routers.domio.tls=true"
      - "traefik.http.routers.domio.tls.certresolver=myresolver"
      - "traefik.http.services.domio.loadbalancer.server.port=3030"

networks:
  traefik-public:
    external: true
